<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TenderPack — Streamlined browser-based Tender Document Package Builder. Verify, order, validate expiry, detect duplicates, and generate compliant submission-ready PDF packages."
    />
    <title>TenderPack — Tender Document Package Builder</title>

    <!-- Google Fonts: Poppins (300-600) & Hind Siliguri (400-600) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-flash script for dark mode -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('tenderpack_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('tenderpack_lang') || 'en';
          document.documentElement.setAttribute('lang', savedLang);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-page text-primary antialiased min-h-screen selection:bg-accent-steel/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
